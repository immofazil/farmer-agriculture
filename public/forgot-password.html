<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer AI Advisor - Forgot Password</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <img src="logo.svg" alt="Farmer AI Logo" />
        </div>
        <h1>Reset Password</h1>
        <p>Enter your email to receive reset instructions</p>
      </div>
      
      <form id="resetForm" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your registered email">
        </div>
        
        <button type="submit" class="login-btn">
          <span>Send Reset Link</span>
          <div class="btn-loader" id="btnLoader"></div>
        </button>
      </form>
      
      <div class="login-footer">
        <p>Remember your password? <a href="/login.html">Sign in here</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      
      // Show loading state
      const btn = document.querySelector('.login-btn');
      const btnText = btn.querySelector('span');
      const loader = document.getElementById('btnLoader');
      
      btnText.style.opacity = '0';
      loader.style.display = 'block';
      btn.disabled = true;
      
      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('Password reset link sent to your email! Please check your inbox.');
          window.location.href = '/login.html';
        } else {
          alert(data.message || 'Failed to send reset link. Please try again.');
        }
      } catch (error) {
        alert('Failed to send reset link. Please try again.');
      } finally {
        btnText.style.opacity = '1';
        loader.style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
