<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer AI Advisor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='100%' height='100%' rx='20' fill='%23a8e063'/><text x='50%' y='54%' font-size='16' text-anchor='middle' fill='white' font-family='Segoe UI, Arial' dy='.3em'>AI</text></svg>" alt="AI" class="sidebar-avatar" />
        <h2>Farmer AI</h2>
      </div>
      
      <button class="new-chat-btn" id="newChatBtn">
        <span>+</span> New Chat
      </button>
      
      <div class="chat-history" id="chatHistory">
        <!-- Chat history items will be added here -->
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message">
            <div class="welcome-avatar">🤖</div>
            <div class="welcome-text">
              <h3>Welcome to Farmer AI Advisor!</h3>
              <p>I'm here to help you with farming questions. Ask me about:</p>
              <ul>
                <li>🌾 Crop selection and timing</li>
                <li>💧 Irrigation and water management</li>
                <li>🌤️ Weather impact on farming</li>
                <li>💰 Market conditions and pricing</li>
                <li>🏛️ Government policies and subsidies</li>
              </ul>
            </div>
          </div>
        </div>
        
        <div class="input-container">
          <form id="chatForm" class="chat-form">
            <div class="input-wrapper">
              <input type="text" id="messageInput" placeholder="Ask me anything about farming..." autocomplete="off" />
              <button type="submit" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    class ChatManager {
      constructor() {
        this.chats = JSON.parse(localStorage.getItem('farmerChats')) || [];
        this.currentChatId = localStorage.getItem('currentChatId') || null;
        this.init();
      }

      init() {
        this.renderChatHistory();
        this.loadCurrentChat();
        this.setupEventListeners();
      }

      createNewChat() {
        const chatId = Date.now().toString();
        const newChat = {
          id: chatId,
          title: 'New Chat',
          messages: [],
          createdAt: new Date().toISOString()
        };
        
        this.chats.unshift(newChat);
        this.currentChatId = chatId;
        this.saveChats();
        this.renderChatHistory();
        this.loadCurrentChat();
      }

      loadCurrentChat() {
        const chat = this.chats.find(c => c.id === this.currentChatId);
        if (chat) {
          this.renderMessages(chat.messages);
        } else {
          this.renderMessages([]);
        }
      }

      addMessage(content, isUser = true) {
        if (!this.currentChatId) {
          this.createNewChat();
        }

        const chat = this.chats.find(c => c.id === this.currentChatId);
        if (chat) {
          chat.messages.push({
            id: Date.now().toString(),
            content,
            isUser,
            timestamp: new Date().toISOString()
          });

          // Update chat title if it's the first user message
          if (isUser && chat.title === 'New Chat') {
            chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
          }

          this.saveChats();
          this.renderMessages(chat.messages);
          this.renderChatHistory();
        }
      }

      async sendMessage(content) {
        this.addMessage(content, true);
        
        // Show typing indicator
        const typingId = this.addTypingIndicator();
        
        try {
          const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: content })
          });
          
          const data = await response.json();
          this.removeTypingIndicator(typingId);
          this.addMessage(data.answer || 'Sorry, I couldn\'t process your request.', false);
        } catch (error) {
          this.removeTypingIndicator(typingId);
          this.addMessage('Sorry, there was an error connecting to the server.', false);
        }
      }

      addTypingIndicator() {
        const typingId = 'typing-' + Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai-message typing';
        typingDiv.id = typingId;
        typingDiv.innerHTML = `
          <div class="message-avatar">🤖</div>
          <div class="message-content">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;
        document.getElementById('chatMessages').appendChild(typingDiv);
        this.scrollToBottom();
        return typingId;
      }

      removeTypingIndicator(typingId) {
        const typingElement = document.getElementById(typingId);
        if (typingElement) {
          typingElement.remove();
        }
      }

      renderMessages(messages) {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        
        if (messages.length === 0) {
          container.innerHTML = `
            <div class="welcome-message">
              <div class="welcome-avatar">🤖</div>
              <div class="welcome-text">
                <h3>Welcome to Farmer AI Advisor!</h3>
                <p>I'm here to help you with farming questions. Ask me about:</p>
                <ul>
                  <li>🌾 Crop selection and timing</li>
                  <li>💧 Irrigation and water management</li>
                  <li>🌤️ Weather impact on farming</li>
                  <li>💰 Market conditions and pricing</li>
                  <li>🏛️ Government policies and subsidies</li>
                </ul>
              </div>
            </div>
          `;
          return;
        }

        messages.forEach(message => {
          const messageDiv = document.createElement('div');
          messageDiv.className = `message ${message.isUser ? 'user-message' : 'ai-message'}`;
          messageDiv.innerHTML = `
            <div class="message-avatar">${message.isUser ? '👨‍🌾' : '🤖'}</div>
            <div class="message-content">${message.content}</div>
          `;
          container.appendChild(messageDiv);
        });
        
        this.scrollToBottom();
      }

      renderChatHistory() {
        const container = document.getElementById('chatHistory');
        container.innerHTML = '';
        
        this.chats.forEach(chat => {
          const chatDiv = document.createElement('div');
          chatDiv.className = `chat-item ${chat.id === this.currentChatId ? 'active' : ''}`;
          chatDiv.onclick = () => this.selectChat(chat.id);
          chatDiv.innerHTML = `
            <span class="chat-title">${chat.title}</span>
            <span class="chat-date">${new Date(chat.createdAt).toLocaleDateString()}</span>
          `;
          container.appendChild(chatDiv);
        });
      }

      selectChat(chatId) {
        this.currentChatId = chatId;
        localStorage.setItem('currentChatId', chatId);
        this.loadCurrentChat();
        this.renderChatHistory();
      }

      scrollToBottom() {
        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
      }

      saveChats() {
        localStorage.setItem('farmerChats', JSON.stringify(this.chats));
        localStorage.setItem('currentChatId', this.currentChatId);
      }

      setupEventListeners() {
        document.getElementById('newChatBtn').onclick = () => this.createNewChat();
        
        document.getElementById('chatForm').onsubmit = (e) => {
          e.preventDefault();
          const input = document.getElementById('messageInput');
          const message = input.value.trim();
          if (message) {
            this.sendMessage(message);
            input.value = '';
          }
        };
      }
    }

    // Initialize the chat manager
    const chatManager = new ChatManager();
  </script>
</body>
</html>
