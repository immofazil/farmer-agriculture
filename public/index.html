<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer AI Advisor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="logo-small.svg" alt="Farmer AI Logo" class="sidebar-avatar" />
        <div class="user-info">
          <h2>Farmer AI</h2>
          <span class="username" id="username">Welcome!</span>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>+</span> New Chat
      </button>

      <div class="chat-history" id="chatHistory">
        <!-- Chat history items will be added here -->
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          Logout
        </button>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message">
            <div class="welcome-avatar">🤖</div>
            <div class="welcome-text">
              <h3>Welcome to Farmer AI Advisor!</h3>
              <p>I'm here to help you with farming questions. Click on any topic below to get started:</p>
              <div class="topic-buttons">
                <button class="topic-btn"
                  onclick="chatManager.sendTopicMessage('Tell me about crop selection and timing')">
                  🌾 Crop selection and timing
                </button>
                <button class="topic-btn"
                  onclick="chatManager.sendTopicMessage('Help me with irrigation and water management')">
                  💧 Irrigation and water management
                </button>
                <button class="topic-btn" onclick="chatManager.sendTopicMessage('How does weather impact farming?')">
                  🌤️ Weather impact on farming
                </button>
                <button class="topic-btn"
                  onclick="chatManager.sendTopicMessage('What are the current market conditions and pricing?')">
                  💰 Market conditions and pricing
                </button>
                <button class="topic-btn"
                  onclick="chatManager.sendTopicMessage('Tell me about government policies and subsidies for farmers')">
                  🏛️ Government policies and subsidies
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="input-container">
          <form id="chatForm" class="chat-form">
            <div class="input-wrapper">
              <input type="text" id="messageInput" placeholder="Ask me anything about farming..." autocomplete="off" />
              <button type="submit" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Delete Chat</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this chat?</p>
        <p class="modal-chat-title" id="modalChatTitle"></p>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel-btn" id="cancelDelete">Cancel</button>
        <button class="modal-btn delete-btn" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // Authentication check
    function checkAuth() {
      const isLoggedIn = localStorage.getItem('isLoggedIn');
      if (isLoggedIn !== 'true') {
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    // Initialize authentication
    if (!checkAuth()) {
      // Stop execution if not authenticated
      throw new Error('Authentication required');
    }

    // Display username
    const username = localStorage.getItem('username') || 'User';
    const fullName = localStorage.getItem('fullName') || username;
    document.getElementById('username').textContent = fullName;

    class ChatManager {
      constructor() {
        this.chats = [];
        this.currentChatId = null;
        this.userId = localStorage.getItem('userId');
        this.pendingDeleteChatId = null;
        this.init();
      }

      async init() {
        await this.loadChatHistory();
        this.setupEventListeners();
        this.setupModalListeners();
      }

      async createNewChat() {
        const chatId = Date.now().toString();
        const newChat = {
          id: chatId,
          title: 'New Chat',
          messages: [],
          createdAt: new Date().toISOString()
        };

        this.chats.unshift(newChat);
        this.currentChatId = chatId;
        this.renderChatHistory();
        this.loadCurrentChat();
      }

      showDeleteModal(chatId, chatTitle) {
        this.pendingDeleteChatId = chatId;
        document.getElementById('modalChatTitle').textContent = chatTitle;
        document.getElementById('deleteModal').style.display = 'flex';
      }

      hideDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
        this.pendingDeleteChatId = null;
      }

      async deleteChat() {
        if (!this.pendingDeleteChatId) return;

        const chatId = this.pendingDeleteChatId;

        // Delete from database if user is logged in
        if (this.userId) {
          try {
            const response = await fetch(`/delete-chat/${this.userId}/${chatId}`, {
              method: 'DELETE'
            });
            const result = await response.json();
            if (!result.success) {
              console.error('Failed to delete chat from database');
            }
          } catch (error) {
            console.error('Error deleting chat from database:', error);
          }
        }

        // Remove from local array
        this.chats = this.chats.filter(chat => chat.id !== chatId);

        // If deleted chat was current, select first available or create new
        if (this.currentChatId === chatId) {
          this.currentChatId = this.chats.length > 0 ? this.chats[0].id : null;
        }

        // Update localStorage
        this.saveToLocalStorage();

        // Re-render
        this.renderChatHistory();
        this.loadCurrentChat();

        // Hide modal
        this.hideDeleteModal();
      }

      async loadCurrentChat() {
        const chat = this.chats.find(c => c.id === this.currentChatId);
        if (chat) {
          this.renderMessages(chat.messages);
        } else {
          this.renderMessages([]);
        }
      }

      async addMessage(content, isUser = true) {
        // If no current chat exists, create one
        if (!this.currentChatId) {
          await this.createNewChat();
        }

        const chat = this.chats.find(c => c.id === this.currentChatId);
        if (chat) {
          chat.messages.push({
            id: Date.now().toString(),
            content,
            isUser,
            timestamp: new Date().toISOString()
          });

          // Update chat title if it's the first user message
          if (isUser && chat.title === 'New Chat') {
            chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
          }

          await this.saveChatToDatabase(chat);
          this.renderMessages(chat.messages);
          this.renderChatHistory();
        }
      }

      async saveChatToDatabase(chat) {
        if (!this.userId) {
          console.warn('No user ID available, saving to localStorage');
          this.saveToLocalStorage();
          return;
        }

        try {
          const response = await fetch('/save-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId: this.userId,
              chatData: {
                chatId: chat.id,
                title: chat.title,
                messages: chat.messages
              }
            })
          });

          const result = await response.json();
          if (!result.success) {
            console.error('Failed to save chat to database, falling back to localStorage');
            this.saveToLocalStorage();
          }
        } catch (error) {
          console.error('Error saving chat:', error);
          this.saveToLocalStorage();
        }
      }

      saveToLocalStorage() {
        localStorage.setItem('farmerChats', JSON.stringify(this.chats));
        localStorage.setItem('currentChatId', this.currentChatId);
      }

      async loadChatHistory() {
        try {
          if (this.userId) {
            // Load from database (primary source)
            const response = await fetch(`/chat-history/${this.userId}`);
            const result = await response.json();
            if (result.success) {
              this.chats = result.chats;
              this.currentChatId = this.chats.length > 0 ? this.chats[0]?.id : null;

              // Clear localStorage to prevent conflicts
              localStorage.removeItem('farmerChats');
              localStorage.removeItem('currentChatId');
            } else {
              // If database fails, use localStorage but migrate to database
              const localChats = JSON.parse(localStorage.getItem('farmerChats')) || [];
              this.chats = localChats;
              this.currentChatId = localStorage.getItem('currentChatId') || null;

              // Migrate local chats to database
              if (localChats.length > 0) {
                await this.migrateLocalChatsToDatabase();
              }
            }
          } else {
            // Use localStorage only if no user ID
            this.chats = JSON.parse(localStorage.getItem('farmerChats')) || [];
            this.currentChatId = localStorage.getItem('currentChatId') || null;
          }

          this.renderChatHistory();
          this.loadCurrentChat();
        } catch (error) {
          console.error('Error loading chat history:', error);
          // Fallback to localStorage
          this.chats = JSON.parse(localStorage.getItem('farmerChats')) || [];
          this.currentChatId = localStorage.getItem('currentChatId') || null;
          this.renderChatHistory();
          this.loadCurrentChat();
        }
      }

      async migrateLocalChatsToDatabase() {
        if (!this.userId) return;

        try {
          for (const chat of this.chats) {
            await this.saveChatToDatabase(chat);
          }
          // Clear localStorage after successful migration
          localStorage.removeItem('farmerChats');
          localStorage.removeItem('currentChatId');
          console.log('Successfully migrated local chats to database');
        } catch (error) {
          console.error('Error migrating chats to database:', error);
        }
      }

      async sendMessage(content) {
        this.addMessage(content, true);

        // Show typing indicator
        const typingId = this.addTypingIndicator();

        try {
          // Get current chat for conversation history
          const currentChat = this.chats.find(c => c.id === this.currentChatId);
          const conversationHistory = currentChat ? currentChat.messages : [];
          
          const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              question: content,
              conversationHistory: conversationHistory
            })
          });

          const data = await response.json();
          this.removeTypingIndicator(typingId);
          
          // Show note if it's a fallback response
          let answer = data.answer;
          if (data.note) {
            answer = `⚠️ ${data.note}\n\n${answer}`;
          }
          
          this.addMessage(answer, false);
        } catch (error) {
          this.removeTypingIndicator(typingId);
          this.addMessage('Sorry, there was an error connecting to the server. Please check your internet connection and try again.', false);
        }
      }

      async sendTopicMessage(message) {
        // Set the input value and trigger send
        const input = document.getElementById('messageInput');
        input.value = message;
        await this.sendMessage(message);
        input.value = '';
      }

      addTypingIndicator() {
        const typingId = 'typing-' + Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai-message typing';
        typingDiv.id = typingId;
        typingDiv.innerHTML = `
          <div class="message-avatar">🤖</div>
          <div class="message-content">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;
        document.getElementById('chatMessages').appendChild(typingDiv);
        this.scrollToBottom();
        return typingId;
      }

      removeTypingIndicator(typingId) {
        const typingElement = document.getElementById(typingId);
        if (typingElement) {
          typingElement.remove();
        }
      }

      renderMessages(messages) {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';

        if (messages.length === 0) {
          container.innerHTML = `
            <div class="welcome-message">
              <div class="welcome-avatar">🤖</div>
              <div class="welcome-text">
                <h3>Welcome to Farmer AI Advisor!</h3>
                <p>I'm here to help you with farming questions. Click on any topic below to get started:</p>
                <div class="topic-buttons">
                  <button class="topic-btn" onclick="chatManager.sendTopicMessage('Tell me about crop selection and timing')">
                    🌾 Crop selection and timing
                  </button>
                  <button class="topic-btn" onclick="chatManager.sendTopicMessage('Help me with irrigation and water management')">
                    💧 Irrigation and water management
                  </button>
                  <button class="topic-btn" onclick="chatManager.sendTopicMessage('How does weather impact farming?')">
                    🌤️ Weather impact on farming
                  </button>
                  <button class="topic-btn" onclick="chatManager.sendTopicMessage('What are the current market conditions and pricing?')">
                    💰 Market conditions and pricing
                  </button>
                  <button class="topic-btn" onclick="chatManager.sendTopicMessage('Tell me about government policies and subsidies for farmers')">
                    🏛️ Government policies and subsidies
                  </button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        messages.forEach(message => {
          const messageDiv = document.createElement('div');
          messageDiv.className = `message ${message.isUser ? 'user-message' : 'ai-message'}`;
          messageDiv.innerHTML = `
            <div class="message-avatar">${message.isUser ? '👨‍🌾' : '🤖'}</div>
            <div class="message-content">${message.content}</div>
          `;
          container.appendChild(messageDiv);
        });

        this.scrollToBottom();
      }

      renderChatHistory() {
        const container = document.getElementById('chatHistory');
        container.innerHTML = '';

        this.chats.forEach(chat => {
          const chatDiv = document.createElement('div');
          chatDiv.className = `chat-item ${chat.id === this.currentChatId ? 'active' : ''}`;
          chatDiv.onclick = () => this.selectChat(chat.id);
          chatDiv.innerHTML = `
            <div class="chat-item-content">
              <span class="chat-title">${chat.title}</span>
              <span class="chat-date">${new Date(chat.createdAt).toLocaleDateString()}</span>
            </div>
            <button class="delete-chat-btn" onclick="chatManager.showDeleteModal('${chat.id}', '${chat.title}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          `;
          container.appendChild(chatDiv);
        });
      }

      selectChat(chatId) {
        this.currentChatId = chatId;
        localStorage.setItem('currentChatId', chatId);
        this.loadCurrentChat();
        this.renderChatHistory();
      }

      scrollToBottom() {
        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
      }

      setupEventListeners() {
        document.getElementById('newChatBtn').onclick = () => this.createNewChat();

        document.getElementById('chatForm').onsubmit = (e) => {
          e.preventDefault();
          const input = document.getElementById('messageInput');
          const message = input.value.trim();
          if (message) {
            this.sendMessage(message);
            input.value = '';
          }
        };

        // Logout functionality
        document.getElementById('logoutBtn').onclick = () => {
          // Clear all user-related data
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('username');
          localStorage.removeItem('fullName');
          localStorage.removeItem('userId');
          localStorage.removeItem('rememberMe');
          localStorage.removeItem('farmerChats');
          localStorage.removeItem('currentChatId');

          // Clear chat manager state
          this.chats = [];
          this.currentChatId = null;

          window.location.href = '/login.html';
        };
      }

      setupModalListeners() {
        // Cancel button
        document.getElementById('cancelDelete').onclick = () => this.hideDeleteModal();

        // Confirm delete button
        document.getElementById('confirmDelete').onclick = () => this.deleteChat();

        // Close modal when clicking overlay
        document.getElementById('deleteModal').onclick = (e) => {
          if (e.target.id === 'deleteModal') {
            this.hideDeleteModal();
          }
        };

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && document.getElementById('deleteModal').style.display === 'flex') {
            this.hideDeleteModal();
          }
        });
      }
    }

    // Initialize the chat manager
    const chatManager = new ChatManager();
  </script>
</body>

</html>
