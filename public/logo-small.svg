<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Robot body (circular base) -->
  <circle cx="20" cy="30" r="8" fill="#2d5016" stroke="#1a3009" stroke-width="1.5"/>
  
  <!-- Farm fields on body -->
  <path d="M14 30 Q17 28 20 30 Q23 32 26 30" fill="none" stroke="#8bc34a" stroke-width="1.5"/>
  <path d="M15 32 Q18 30 21 32 Q24 34 27 32" fill="none" stroke="#8bc34a" stroke-width="1.5"/>
  
  <!-- Plant symbol on chest -->
  <path d="M20 27 L20 33" stroke="#a8e063" stroke-width="1.5"/>
  <path d="M18 28 Q20 27 22 28" fill="none" stroke="#a8e063" stroke-width="1.5"/>
  
  <!-- Robot head (rectangular with rounded corners) -->
  <rect x="15" y="10" width="10" height="8" rx="1.5" fill="#3f51b5" stroke="#2d5016" stroke-width="1.5"/>
  
  <!-- Robot eyes -->
  <circle cx="17.5" cy="14" r="1.2" fill="#ffc107"/>
  <circle cx="22.5" cy="14" r="1.2" fill="#ffc107"/>
  
  <!-- Robot mouth -->
  <rect x="18.5" y="16" width="3" height="1" rx="0.5" fill="#ffffff"/>
  
  <!-- Farmer hat -->
  <ellipse cx="20" cy="10" rx="9" ry="2" fill="#2d5016"/>
  <ellipse cx="20" cy="8" rx="8" ry="4" fill="#2d5016"/>
  <rect x="14" y="9" width="12" height="1.5" fill="#ffc107"/>
  
  <!-- Hat brim -->
  <ellipse cx="20" cy="10" rx="10" ry="1.5" fill="none" stroke="#2d5016" stroke-width="1.5"/>
  
  <!-- Robot arms -->
  <rect x="10" y="20" width="4" height="5" rx="2" fill="#2d5016"/>
  <rect x="26" y="20" width="4" height="5" rx="2" fill="#2d5016"/>
  
  <!-- Speech bubble -->
  <ellipse cx="32" cy="13" rx="5" ry="3" fill="#ffc107"/>
  <path d="M28 14 L30 16 L31 14" fill="#ffc107"/>
  
  <!-- Control panel on chest -->
  <rect x="17" y="24" width="6" height="3" rx="0.5" fill="#ffffff" stroke="#2d5016"/>
  <circle cx="18.5" cy="25.5" r="0.5" fill="#ffc107"/>
  <circle cx="20" cy="25.5" r="0.5" fill="#ffc107"/>
  <circle cx="21.5" cy="25.5" r="0.5" fill="#ffc107"/>
</svg>