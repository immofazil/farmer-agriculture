<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Robot body (circular base) -->
  <circle cx="30" cy="45" r="12" fill="#2d5016" stroke="#1a3009" stroke-width="2"/>
  
  <!-- Farm fields on body -->
  <path d="M20 45 Q25 42 30 45 Q35 48 40 45" fill="none" stroke="#8bc34a" stroke-width="2"/>
  <path d="M22 48 Q27 45 32 48 Q37 51 42 48" fill="none" stroke="#8bc34a" stroke-width="2"/>
  
  <!-- Plant symbol on chest -->
  <path d="M30 40 L30 50" stroke="#a8e063" stroke-width="2"/>
  <path d="M27 42 Q30 40 33 42" fill="none" stroke="#a8e063" stroke-width="2"/>
  <path d="M27 44 Q30 42 33 44" fill="none" stroke="#a8e063" stroke-width="2"/>
  
  <!-- Robot head (rectangular with rounded corners) -->
  <rect x="22" y="15" width="16" height="12" rx="2" fill="#3f51b5" stroke="#2d5016" stroke-width="2"/>
  
  <!-- Robot eyes -->
  <circle cx="26" cy="21" r="2" fill="#ffc107"/>
  <circle cx="34" cy="21" r="2" fill="#ffc107"/>
  
  <!-- Robot mouth -->
  <rect x="28" y="24" width="4" height="1.5" rx="0.5" fill="#ffffff"/>
  
  <!-- Farmer hat -->
  <ellipse cx="30" cy="15" rx="14" ry="3" fill="#2d5016"/>
  <ellipse cx="30" cy="12" rx="12" ry="6" fill="#2d5016"/>
  <rect x="20" y="13" width="20" height="2" fill="#ffc107"/>
  
  <!-- Hat brim -->
  <ellipse cx="30" cy="15" rx="16" ry="2" fill="none" stroke="#2d5016" stroke-width="2"/>
  
  <!-- Robot arms -->
  <rect x="15" y="30" width="6" height="8" rx="3" fill="#2d5016"/>
  <rect x="39" y="30" width="6" height="8" rx="3" fill="#2d5016"/>
  
  <!-- Speech bubble -->
  <ellipse cx="48" cy="20" rx="8" ry="5" fill="#ffc107"/>
  <path d="M42 22 L45 25 L47 22" fill="#ffc107"/>
  
  <!-- Control panel on chest -->
  <rect x="26" y="35" width="8" height="4" rx="1" fill="#ffffff" stroke="#2d5016"/>
  <circle cx="28" cy="37" r="0.8" fill="#ffc107"/>
  <circle cx="30" cy="37" r="0.8" fill="#ffc107"/>
  <circle cx="32" cy="37" r="0.8" fill="#ffc107"/>
</svg>