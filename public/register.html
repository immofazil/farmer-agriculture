<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer AI Advisor - Register</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="login.css">
  <style>
    .password-field {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }
    
    .password-toggle:hover {
      color: #333;
    }
    
    .error-message {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <img src="logo.svg" alt="Farmer AI Logo" />
        </div>
        <h1>Create Account</h1>
        <p>Join Farmer AI Advisor today</p>
      </div>
      
      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Choose a username" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" required placeholder="Create a password" autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
          </div>
        </div>
        
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span class="checkmark"></span>
            I agree to the terms and conditions
          </label>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <button type="submit" class="login-btn">
          <span>Create Account</span>
          <div class="btn-loader" id="btnLoader"></div>
        </button>
      </form>
      
      <div class="login-footer">
        <p>Already have an account? <a href="/login.html">Sign in here</a></p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const toggle = field.nextElementSibling;
      
      if (field.type === 'password') {
        field.type = 'text';
        toggle.textContent = '🙈';
      } else {
        field.type = 'password';
        toggle.textContent = '👁️';
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideError();
      
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      
      // Validation
      if (!fullName || !username || !email || !password || !confirmPassword) {
        showError('Please fill in all fields');
        return;
      }
      
      if (password !== confirmPassword) {
        showError('Passwords do not match!');
        return;
      }
      
      if (password.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }
      
      if (!agreeTerms) {
        showError('Please agree to the terms and conditions');
        return;
      }
      
      // Show loading state
      const btn = document.querySelector('.login-btn');
      const btnText = btn.querySelector('span');
      const loader = document.getElementById('btnLoader');
      
      btnText.style.opacity = '0';
      loader.style.display = 'block';
      btn.disabled = true;
      
      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, username, email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert('Account created successfully! Please sign in.');
          window.location.href = '/login.html';
        } else {
          showError(data.message || 'Registration failed. Please try again.');
        }
      } catch (error) {
        console.error('Registration error:', error);
        showError('Network error. Please check your connection and try again.');
      } finally {
        btnText.style.opacity = '1';
        loader.style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
